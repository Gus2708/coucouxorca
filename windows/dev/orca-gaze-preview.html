<!doctype html><html><head><meta charset="utf-8"><title>Orca gaze preview</title><style>body{background:#202225;color:#edf0f2;font:14px system-ui;margin:32px}h1{font-size:22px}section{display:flex;gap:12px}article{width:160px;text-align:center}canvas{display:block;margin:auto}</style></head><body><h1>Orca gaze · no mouth</h1><p>Actual BotEngine, diagnostic gaze poses. Eyes and markings share one animated projection.</p><section id="poses"></section><script type="module">
import {BotEngine} from '/src/mochi/engine.ts';
BotEngine.setOrcaSkin(true);const avatars=[];
for(const [name,yaw,pitch] of [['Left',-.45,0],['Center',0,0],['Right',.45,0],['Up',0,.32],['Down',0,-.32]]){
 const article=document.createElement('article');article.innerHTML=`<h2>${name}</h2>`;
 for(const mini of [false,true]){const canvas=document.createElement('canvas'),size=mini?44:152;canvas.width=size*2;canvas.height=size*2;canvas.style.width=size+'px';canvas.style.height=size+'px';article.append(canvas);const engine=new BotEngine();engine.isMini=mini;avatars.push({engine,canvas,size,yaw,pitch});}
 document.querySelector('#poses').append(article);
}
function paint(){for(const a of avatars){a.engine.yaw=a.yaw;a.engine.pitch=a.pitch;const x=a.canvas.getContext('2d');x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,a.size,a.size);a.engine.draw(x,a.size,a.size)}}
let last=performance.now();function frame(t){for(const a of avatars)a.engine.update(Math.min(.05,(t-last)/1000));last=t;paint();requestAnimationFrame(frame)}requestAnimationFrame(frame);window.gazeFixture={avatars,paint};
</script></body></html>
